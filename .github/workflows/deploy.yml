name: Deploy to GitHub Pages

# Builds the static frontend and publishes it to GitHub Pages. Runs on
# every push to main, and again whenever the daily weekly-projections.yml
# run finishes (see the workflow_run note below for why both are needed) --
# that's what makes the static site "feel live".
#
# One-time setup: in the repo's Settings -> Pages, set "Source" to
# "GitHub Actions" (not "Deploy from a branch").

on:
  push:
    branches: [main]
  # The daily projections commit is pushed by the Actions bot using
  # GITHUB_TOKEN, and GitHub deliberately does NOT fire `push` workflows
  # for those pushes -- so without this, the site only ever redeploys when
  # a human pushes, and serves stale data in between. workflow_run has no
  # such restriction.
  workflow_run:
    workflows: ["Update Weekly Projections"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
