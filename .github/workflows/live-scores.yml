name: Update Live Scores

# HOW THIS RUNS -- and why it isn't a 10-minute cron:
# GitHub's `schedule` trigger is best-effort and, for this repo, badly late:
# the daily projections job (scheduled 13:00 UTC) has started 3-5 HOURS late
# on all 8 of 8 runs, and a `*/10` schedule here produced zero runs in 75+
# minutes of active windows. So a cron can't deliver a 10-minute cadence.
#
# Instead ONE job loops on its own (every 5 minutes) while games are on:
# each pass runs sync_live_scores.py, commits live.json if it changed, then
# asks the script whether to keep going. The script says stop once no game
# is in progress or starting within 8 hours (LOOKAHEAD_MIN), so an idle
# day's trigger costs about a minute, while a late-morning nudge on a game
# day still keeps the loop alive until the evening kickoff. A job is capped
# at 6h, so after ~5.5h it hands off to a fresh run of itself if the slate
# isn't over.
#
# The loop only needs to be STARTED, by any of:
#   - the daily projections job (dispatches this at the end of every run)
#   - the best-effort schedule anchors below (may fire late or not at all)
#   - "Run workflow" by hand, e.g. right before kickoff -- the reliable option
# Extra starts while a loop is running just queue one pending run that exits
# immediately when it finds nothing happening.
#
# live.json is read by the site through the GitHub contents API, NOT through
# the Pages CDN, so no redeploy is needed per tick (see src/lib/liveScores.js).

on:
  schedule:
    # Best-effort starters only; minutes are off the top of the hour, when
    # GitHub is busiest. UTC: evening-ET games run past midnight UTC.
    - cron: "17 23 * * 4"          # Thursday night
    - cron: "17 16,19 * * 6"       # Saturday games (late season)
    - cron: "17 13,16,19 * * 0"    # Sunday: London game, main slate, late window
    - cron: "17 23 * * 1"          # Monday night
  workflow_dispatch:
    inputs:
      debug:
        description: "Print the raw box-score shape and a per-player self-check (our points vs ESPN's) on the first pass"
        type: boolean
        default: false

permissions:
  contents: write # commit live.json
  actions: write  # hand off to a fresh run when the 6h job cap approaches

# One loop at a time. Kept separate from the daily job's group on purpose: a
# 5-hour loop must never block the daily projections run.
concurrency:
  group: live-loop
  cancel-in-progress: false

jobs:
  live-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Live scores loop
        env:
          GH_TOKEN: ${{ github.token }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: ${{ vars.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ vars.ESPN_TEAM_ID }}
          LIVE_STATE_FILE: ${{ runner.temp }}/live_state.json
          DEBUG_FIRST_PASS: ${{ inputs.debug && '1' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          deadline=$(( $(date +%s) + 19800 ))   # 5h30m, under the 6h job cap
          debug="$DEBUG_FIRST_PASS"

          while true; do
            # Pick up the daily job's commits (and the week rollover) each pass.
            git pull --rebase -q origin main || true

            rm -f "$LIVE_STATE_FILE"
            LIVE_SCORES_DEBUG="$debug" python scripts/sync_live_scores.py || true
            debug=""   # the verbose dump is only useful once

            git add public/data/
            if ! git diff --cached --quiet; then
              git commit -q -m "chore: live scores ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
              # The daily job may have pushed meanwhile; rebase and retry.
              for attempt in 1 2 3; do
                git pull --rebase -q origin main && git push -q && break
                sleep 5
              done
            fi

            keep=$(python -c "import json,os;p=os.environ['LIVE_STATE_FILE'];print(json.load(open(p)).get('keep_going', True) if os.path.exists(p) else True)")
            if [ "$keep" != "True" ]; then
              echo "No game in progress or starting within 8h -- stopping."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Approaching the 6h job cap with games still on -- handing off to a fresh run."
              gh workflow run live-scores.yml --ref main
              exit 0
            fi
            sleep 300
          done
