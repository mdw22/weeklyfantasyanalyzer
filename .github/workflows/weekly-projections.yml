name: Update Weekly Projections

# Runs the nflreadpy-based projection script daily and commits the output
# back into the repo, so the static frontend always has fresh JSON to read.
# GitHub Pages can't run this itself (no server) -- this workflow is the
# entire "backend."
#
# Also runs the (optional) ESPN roster sync. It stays off until you add
# four values in this repo's Settings -> Secrets and variables -> Actions:
#   Secrets:   ESPN_S2, ESPN_SWID       (from your browser's ESPN cookies)
#   Variables: ESPN_LEAGUE_ID, ESPN_TEAM_ID  (from your league's URL, not secret)
# See scripts/sync_espn.py's docstring and the README's "ESPN Sync Setup"
# section for exactly how to get these. Until they're set, sync_espn.py
# prints a message and exits cleanly -- manual roster entry keeps working
# either way.

on:
  schedule:
    # 13:00 UTC ≈ 6am PT / 9am ET. Adjust to taste -- daily is what you
    # asked for; just be mindful this also uses your repo's free Actions
    # minutes every single day.
    - cron: "0 13 * * *"
  workflow_dispatch: # lets you trigger a run manually from the Actions tab
    inputs:
      log_espn_scoring:
        description: "Also print your league's ESPN scoring rules to the log (one-off check for the DEF tier tables)"
        type: boolean
        default: false

permissions:
  contents: write # needed to commit the regenerated data/ files back

# Serialize with the live-scores job so their pushes never race.
concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  update-projections:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Generate projections + history
        run: python scripts/generate_projections.py

      - name: Sync ESPN league rosters (optional -- no-ops if not configured)
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: ${{ vars.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ vars.ESPN_TEAM_ID }}
          ESPN_LOG_SCORING: ${{ inputs.log_espn_scoring && '1' || '' }}
        run: python scripts/sync_espn.py

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No changes to commit today."
          else
            git commit -m "chore: update weekly projections ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
